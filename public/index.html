<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">WhatsApp Bulk Dispatcher</h1>
            <div class="flex items-center space-x-3">
                <span id="connection-status" class="px-3 py-1 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-800">Checking...</span>
                <button onclick="checkConnection()" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium transition">
                    ?? Check Connection
                </button>
            </div>
        </div>

        <div id="status-box" class="mb-6 p-4 bg-gray-50 rounded-lg border">
            <p id="status-text" class="text-gray-700">Connecting to WhatsApp backend...</p>
        </div>

        <!-- Messaging Form Placeholder -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Phone Number / Broadcast</label>
                <input type="text" id="phone" placeholder="919876543210" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Message</label>
                <textarea id="message" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" placeholder="Type your message..."></textarea>
            </div>
            <button onclick="sendMessage()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                Send Message
            </button>
        </div>
    </div>

    <script>
        async function checkConnection() {
            const statusBadge = document.getElementById('connection-status');
            const statusText = document.getElementById('status-text');
            statusBadge.innerText = 'Checking...';
            statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-800';

            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                if (data.ready) {
                    statusBadge.innerText = 'Connected ?';
                    statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800';
                    statusText.innerHTML = `Connected as: <b>${data.user || 'Active'}</b>`;
                } else if (data.qr) {
                    statusBadge.innerText = 'Scan QR / Pair ??';
                    statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-orange-100 text-orange-800';
                    statusText.innerText = 'Session requires authentication. Scan QR or use pairing code.';
                } else {
                    statusBadge.innerText = 'Connecting... ?';
                    statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-blue-100 text-blue-800';
                    statusText.innerText = data.error ? `Error: ${data.error}` : 'Browser is starting up in cloud. Please wait...';
                }
            } catch (err) {
                statusBadge.innerText = 'Offline ?';
                statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800';
                statusText.innerText = 'Could not reach server status API.';
            }
        }

        async function sendMessage() {
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, message })
            });
            const data = await res.json();
            alert(data.success ? 'Message sent successfully!' : 'Error: ' + data.error);
        }

        // Check connection on load and every 10 seconds automatically
        checkConnection();
        setInterval(checkConnection, 10000);
    </script>
</body>
</html>
